name: polybot

on:
  schedule:
    - cron: "*/30 * * * *"      # GitHub throttles this; each run keeps cycling every 2 min for up to 5.5 h while games are live
  push:
    paths: ["polybot/**", "requirements.txt", ".github/workflows/trade.yml", "state/STOP"]   # code changes and pause/resume start a run
  workflow_dispatch:
    inputs:
      live:
        description: "Set to 'false' to force paper mode for this run"
        default: "true"

concurrency:
  group: polybot-${{ github.ref_name }}
  cancel-in-progress: true   # only code pushes trigger runs (state commits are path-filtered), so a new run should replace the old loop

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      # Every package, including dependencies, is pinned to a version and hash
      # (requirements.txt, compiled from requirements.in), since this step runs
      # with the wallet key in reach.
      - run: pip install --require-hashes -r requirements.txt

      - name: Run one trading cycle
        env:
          EXCHANGE: ${{ vars.EXCHANGE || 'us' }}
          # Trading credentials reach the default branch only; every other branch
          # paper-trades and never needs them.
          POLYMARKET_US_KEY_ID: ${{ github.ref_name == 'main' && secrets.POLYMARKET_US_KEY_ID || '' }}
          POLYMARKET_US_SECRET: ${{ github.ref_name == 'main' && secrets.POLYMARKET_US_SECRET || '' }}
          POLYMARKET_PRIVATE_KEY: ${{ github.ref_name == 'main' && secrets.POLYMARKET_PRIVATE_KEY || '' }}
          POLYMARKET_FUNDER: ${{ github.ref_name == 'main' && secrets.POLYMARKET_FUNDER || '' }}
          POLYMARKET_SIGNATURE_TYPE: ${{ vars.POLYMARKET_SIGNATURE_TYPE || '1' }}
          # only the default branch trades real money; every other branch paper-trades
          LIVE: ${{ github.ref_name == 'main' && (github.event.inputs.live || 'true') || 'false' }}
          BANKROLL_USD: ${{ vars.BANKROLL_USD || '25' }}
          RISK_PROFILE: ${{ vars.RISK_PROFILE || 'aggressive' }}
          SPORTS_ONLY: ${{ vars.SPORTS_ONLY || 'true' }}
          SPORTS_LEAGUES: ${{ vars.SPORTS_LEAGUES || 'nfl,cfb' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPEN_ROUTER_SECRET }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '~typesafe/jev-latest' }}
          HARVEST_ENABLED: ${{ vars.HARVEST_ENABLED || 'true' }}
          ENABLE_NEGRISK_ARB: ${{ vars.ENABLE_NEGRISK_ARB || 'false' }}
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          python -m polybot.run --loop-minutes ${{ github.ref_name == 'main' && (vars.LOOP_MINUTES || '330') || '0' }} \
            --interval-seconds ${{ vars.LOOP_INTERVAL_SECONDS || '120' }} \
            --commit-every-minutes ${{ github.ref_name == 'main' && '10' || '0' }}

      - name: Commit state
        if: github.ref_name == 'main'
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "polybot: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
