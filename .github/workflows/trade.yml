name: polybot

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min; during games each run keeps cycling every 2 min (public repo: free)
  push:
    paths: ["polybot/**", "requirements.txt", ".github/workflows/trade.yml"]   # a code change runs one cycle
  workflow_dispatch:
    inputs:
      live:
        description: "Set to 'false' to force paper mode for this run"
        default: "true"

concurrency:
  group: polybot-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one trading cycle
        env:
          EXCHANGE: ${{ vars.EXCHANGE || 'us' }}
          POLYMARKET_US_KEY_ID: ${{ secrets.POLYMARKET_US_KEY_ID }}
          POLYMARKET_US_SECRET: ${{ secrets.POLYMARKET_US_SECRET }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_FUNDER: ${{ secrets.POLYMARKET_FUNDER }}
          POLYMARKET_SIGNATURE_TYPE: ${{ vars.POLYMARKET_SIGNATURE_TYPE || '1' }}
          # only the default branch trades real money; every other branch paper-trades
          LIVE: ${{ github.ref_name == 'main' && (github.event.inputs.live || 'true') || 'false' }}
          BANKROLL_USD: ${{ vars.BANKROLL_USD || '25' }}
          RISK_PROFILE: ${{ vars.RISK_PROFILE || 'aggressive' }}
          SPORTS_ONLY: ${{ vars.SPORTS_ONLY || 'true' }}
          SPORTS_LEAGUES: ${{ vars.SPORTS_LEAGUES || 'nfl,cfb' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPEN_ROUTER_SECRET }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || '~typesafe/jev-latest' }}
          HARVEST_ENABLED: ${{ vars.HARVEST_ENABLED || 'true' }}
          ENABLE_NEGRISK_ARB: ${{ vars.ENABLE_NEGRISK_ARB || 'false' }}
        run: python -m polybot.run --loop-minutes ${{ vars.LOOP_MINUTES || '27' }} --interval-seconds ${{ vars.LOOP_INTERVAL_SECONDS || '120' }}

      - name: Commit state
        if: github.ref_name == 'main'
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "polybot: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
